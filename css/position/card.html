<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Poppins, sans-serif;
      }

      body {
        background: #f5f5f5;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding-top: 90px;
      }

      .navigasi {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 70px;
        background: #111;
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
      }

      .card {
        position: relative;
        width: 360px;
        background: #fff;
        border-radius: 20px;
        padding: 65px 25px 30px;
        text-align: center;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        transition: 0.3s;
      }

      .card:hover {
        transform: translateY(-8px);
      }

      .profile {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translate(-50%, -50%);
      }

      .profile img {
        width: 90px;
        height: 90px;
        border-radius: 50%;
        object-fit: cover;
        border: 5px solid #fff;
      }

      h3 {
        color: #222;
        margin-bottom: 15px;
      }

      p {
        color: #666;
        line-height: 1.7;
      }

      .line {
        width: 100%;
        height: 1px;
        background: #ddd;
        margin: 20px 0;
      }

      .stars {
        color: #ffc107;
        font-size: 22px;
      }

      .social {
        display: flex;
        margin-top: 20px;
        right: 0;
        gap: 10px;
      }

      .social button {
        border: none;
        padding: 10px 20px;
        color: #fff;
        border-radius: 20px;
        cursor: pointer;
        transition: 0.3s;
      }

      .social button:hover {
        transform: translateY(-3px);
      }

      .ig {
        background: #e1306c;
      }

      .wa {
        background: #25d366;
      }

      .fb {
        background: #1877f2;
      }
    </style>
  </head>
  <body>
    <nav class="navigasi">
      <h1>Navigasi</h1>
    </nav>

    <div class="card">
      <div class="profile">
        <img
          src="https://images.unsplash.com/photo-1785291669983-ee1dfad39a5d?q=80&w=735&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
          alt=""
        />
      </div>

      <h3>"Azzam is an amazing developer."</h3>

      <p>
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Tempora
        officiis consequuntur recusandae molestiae accusamus beatae.
      </p>

      <div class="line"></div>

      <div class="stars">★ ★ ★ ★ ★</div>
    </div>

    <div class="social">
      <button class="ig">Instagram</button>
      <button class="wa">WhatsApp</button>
      <button class="fb">Facebook</button>
    </div>
    
  </body>
</html>
