<html lang="en">
  <head>

    <title>Document</title>

        border: 2px black solid;

        position: relative;
      }
      .kuning {
        background: yellow;
        color: black;
        position: absolute;
        top: 0;
        width: 100px;
        height: 100px;
        right:0;
      }
      .merah {
        background: red;
        color: black;
        width: 100px;
        height: 100px;
              }
    </style>
  </head>
  <body>
    <div class="container">
      <div>
        <div class="merah">merah</div>
        <div class="kuning">kuning</div>
      </div>
    </div>
  </body>
</html>
