<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <style>
    .container {
      width: 700px;
      color: white;
      border: 2px black solid;
      height: 500px;
      margin: auto;
      position: relative;
    }
    .kuning {
      background: yellow;
      color: black;
      position: absolute;
      top: 0;
      width: 100px;
      height: 100px;
      right: 0;
    }
    .merah {
      background: red;
      color: black;
      width: 100px;
      height: 100px;
    }
    .wrapper {
      position: relative;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="wrapper">
      <div class="merah">merah 1</div>
      <div class="kuning">kuning 1</div>
    </div>
    <div class="wrapper">
      <div class="merah">merah 2</div>
      <div class="kuning">kuning 2</div>
    </div>
    <div class="wrapper">
      <div class="merah">merah 3</div>
      <div class="kuning">kuning 3</div>
    </div>
    <div class="wrapper">
      <div class="merah">merah 4</div>
      <div class="kuning">kuning 4</div>
    </div>
    <div class="wrapper">
      <div class="merah">merah 5</div>
      <div class="kuning">kuning 5</div>
    </div>
  </div>
</body>
</html>
